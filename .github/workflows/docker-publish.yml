# Builds the image for linux/amd64 + linux/arm64 and pushes it to
#   ghcr.io/<owner>/mangadex-webdl        (always; uses the built-in GITHUB_TOKEN)
#   docker.io/<DOCKERHUB_USERNAME>/mangadex-webdl   (when the Docker Hub settings below exist)
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Variables: DOCKERHUB_USERNAME   your Docker Hub user or organisation
#   Secrets:   DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write scope
#
# Tags: push to main → :edge · tag v1.2.3 → :1.2.3, :1.2, :1, :latest · pull requests → build only.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "images<<EOF"
            echo "ghcr.io/${owner}/mangadex-webdl"
            if [ -n "${DOCKERHUB_USERNAME}" ] && [ "${HAS_DOCKERHUB_TOKEN}" = "true" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/mangadex-webdl"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ "${HAS_DOCKERHUB_TOKEN}" = "true" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.names.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=MangaDex WebDL
            org.opencontainers.image.description=Self-hosted MangaDex download manager (FastAPI + React, Docker)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update the Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v') && steps.names.outputs.dockerhub == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/mangadex-webdl
          short-description: Self-hosted MangaDex download manager (FastAPI + React, Docker)
          readme-filepath: ./docs/DOCKERHUB.md
